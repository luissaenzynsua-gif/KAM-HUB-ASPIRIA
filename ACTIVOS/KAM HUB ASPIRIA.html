<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAM Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#0E1422; --muted:#6B7280; --faint:#9AA1AE;
  --line:#ECEEF3; --line-2:#E4E7EE;
  --brand:#6D28D9; --brand-2:#DB2777; --brand-soft:#F3EEFF;
  --emerald:#0FB97B; --emerald-soft:#E5F8F0;
  --amber:#F59E0B; --amber-soft:#FEF4E2;
  --rose:#F43F5E; --rose-soft:#FEECEF;
  --sky:#0EA5E9; --sky-soft:#E4F4FE;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,20,34,.04), 0 8px 24px rgba(16,20,34,.05);
  --shadow-lg:0 18px 50px rgba(16,20,34,.12);
  --font:'Plus Jakarta Sans',system-ui,sans-serif; --data:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#dcdfe7;border-radius:20px;border:3px solid var(--bg)}
.tnum{font-family:var(--data);font-feature-settings:"tnum"}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 70% -10%,#efe7ff,transparent),radial-gradient(900px 500px at 10% 110%,#ffe4f1,transparent),var(--bg);padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:36px 34px}
.login .mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;box-shadow:0 10px 24px rgba(109,40,217,.35);margin-bottom:20px}
.login h1{font-size:23px;font-weight:800;letter-spacing:-.03em}
.login p{color:var(--muted);font-size:13.5px;margin-top:4px;margin-bottom:22px}
.login label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.login input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;font-size:14px;outline:none;margin-bottom:14px}
.login input:focus{border-color:var(--brand)}
.login .demo{display:flex;gap:8px;margin-top:8px}
.login .demo button{flex:1;padding:10px;border:1px solid var(--line-2);border-radius:11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.login .demo button:hover{border-color:var(--brand);color:var(--brand)}
.login .hint{font-size:11.5px;color:var(--faint);margin-top:16px;text-align:center}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.logo .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(109,40,217,.35)}
.logo b{font-weight:800;font-size:16px;letter-spacing:-.02em}
.logo span{display:block;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;color:var(--muted);font-weight:600;font-size:13.5px;transition:.16s;width:100%;text-align:left}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand)}
.nav-item .ic{width:19px;height:19px;flex:none;stroke-width:2}
.nav-item .badge{margin-left:auto;background:var(--rose);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side-foot small{color:var(--faint);font-size:11px;display:block}
.logout{margin-left:auto;color:var(--faint)}
.logout:hover{color:var(--rose)}
.role-tag{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:6px;text-transform:uppercase}
.role-admin{background:#0E1422;color:#fff}.role-kam{background:var(--brand-soft);color:var(--brand)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,247,251,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px}
.hamb{display:none}
.greet h1{font-size:21px;font-weight:800;letter-spacing:-.025em}
.greet p{color:var(--muted);font-size:12.5px;margin-top:1px}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-2);padding:9px 14px;border-radius:11px;width:260px;color:var(--faint)}
.search input{border:none;outline:none;background:none;font-size:13px;width:100%;color:var(--ink)}
.icon-btn{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);position:relative}
.icon-btn:hover{color:var(--brand)}
.content{padding:24px 28px 48px;flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap{gap:14px}.gap8{gap:8px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.h-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.page-h h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.page-h p{color:var(--muted);font-size:13px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;font-weight:700;font-size:13px;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 6px 16px rgba(109,40,217,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:var(--rose-soft);color:#d22a45;border:1px solid #f9c9d1}
.btn-danger:hover{background:var(--rose);color:#fff}
.btn-sm{padding:7px 11px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.chip .d{width:6px;height:6px;border-radius:50%}
.c-emerald{background:var(--emerald-soft);color:#0a8f5e}.c-emerald .d{background:var(--emerald)}
.c-amber{background:var(--amber-soft);color:#b9760a}.c-amber .d{background:var(--amber)}
.c-rose{background:var(--rose-soft);color:#d22a45}.c-rose .d{background:var(--rose)}
.c-sky{background:var(--sky-soft);color:#0a82bb}.c-sky .d{background:var(--sky)}
.c-violet{background:var(--brand-soft);color:var(--brand)}.c-violet .d{background:var(--brand)}
.c-slate{background:#EEF1F6;color:#5a6373}.c-slate .d{background:#94a0b3}

.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,1fr)}
.cols-2{grid-template-columns:1.6fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2e{grid-template-columns:1fr 1fr}

.kpi{position:relative;overflow:hidden}
.kpi .ic-wrap{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.kpi .val{font-size:28px;font-weight:800;letter-spacing:-.03em;font-family:var(--data)}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.kpi .delta{position:absolute;top:18px;right:18px;font-size:11.5px;font-weight:700}
.up{color:var(--emerald)}.down{color:var(--rose)}

/* results card (adaptable) */
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.res-cell{background:var(--bg);border-radius:14px;padding:14px}
.res-cell .rv{font-size:24px;font-weight:800;font-family:var(--data);letter-spacing:-.02em}
.res-cell .rl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.res-cell .rd{font-size:11px;font-weight:700;margin-top:6px}

/* leaderboard / lists */
.lb-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb-item:last-child{border:none}
.rank{width:22px;font-weight:800;color:var(--faint);font-family:var(--data);text-align:center}
.rank.top{color:var(--brand)}
.lb-name{font-weight:700;font-size:13.5px}.lb-sub{font-size:11.5px;color:var(--faint)}
.lb-bar{flex:1;height:6px;background:var(--bg);border-radius:6px;overflow:hidden;max-width:120px;margin-left:auto}
.lb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.lb-val{font-family:var(--data);font-weight:800;font-size:13px;width:44px;text-align:right}

/* hbar % */
.hbar{margin-bottom:11px}
.hbar .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px}
.hbar .track{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:6px}

/* table */
.tbl-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:12px 14px;background:var(--bg)}
.table th:first-child{border-radius:10px 0 0 10px}.table th:last-child{border-radius:0 10px 10px 0}
.table td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.table tr:hover td{background:#FAFAFE}
.t-brand{display:flex;align-items:center;gap:11px}
.t-logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.t-name{font-weight:700}.t-cat{font-size:11.5px;color:var(--faint)}
.kam-pill{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px}
.kam-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal-h{font-size:10px;font-weight:700;color:var(--faint);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);position:relative;font-family:var(--data);cursor:pointer;transition:.13s;border:1px solid transparent}
.cal-d:hover{background:var(--bg)}
.cal-d.muted{color:#c8cdd6;cursor:default}
.cal-d.today{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800}
.cal-d.has{border-color:var(--brand-soft);background:#faf7ff}
.cal-d.has.today{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.cal-d .evd{position:absolute;bottom:5px;display:flex;gap:2px}
.cal-d .evd i{width:5px;height:5px;border-radius:50%}
.cal-d.today .evd i{background:#fff!important}

/* tasks */
.task{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:none}
.tcheck{width:19px;height:19px;border-radius:6px;border:2px solid var(--line-2);flex:none;margin-top:1px;cursor:pointer;transition:.15s;display:grid;place-items:center}
.tcheck.done{background:var(--emerald);border-color:var(--emerald)}
.tcheck.done svg{stroke:#fff}
.task.done .ttext{text-decoration:line-through;color:var(--faint)}
.ttext{font-weight:600;font-size:13px}
.tmeta{font-size:11px;color:var(--faint);margin-top:2px}
.call-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.call-item:last-child{border:none}
.call-btn{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--emerald-soft);color:#0a8f5e;display:grid;place-items:center}
.call-btn:hover{background:var(--emerald);color:#fff}
.act-btns{margin-left:auto;display:flex;gap:6px;flex:none}
.mini-act{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;transition:.14s}
.mini-act.wa{background:#e7f8ef;color:#128C7E}.mini-act.wa:hover{background:#25D366;color:#fff}
.mini-act.gm{background:#fdeaea;color:#EA4335}.mini-act.gm:hover{background:#EA4335;color:#fff}
.mini-act.rg{background:var(--brand-soft);color:var(--brand)}.mini-act.rg:hover{background:var(--brand);color:#fff}

/* segmented + filters */
.seg{display:inline-flex;background:var(--bg);border-radius:11px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.input,select.input{padding:9px 13px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);font-size:13px;outline:none}
.input:focus{border-color:var(--brand)}

/* assets / bank */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.asset{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);transition:.15s}
.asset:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.asset .thumb{height:96px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;position:relative}
.asset .a-body{padding:11px 13px}
.asset .a-name{font-weight:700;font-size:12.5px}
.asset .a-meta{font-size:10.5px;color:var(--faint);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.a-dl{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#0E1422}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);max-height:660px}
.chat-body{flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:80%;padding:13px 16px;border-radius:16px;font-size:13.5px;line-height:1.5}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-bottom-right-radius:5px}
.bubble.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.ai b{color:var(--brand)}
.chat-suggest{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.suggest{padding:9px 13px;border:1px solid var(--line-2);border-radius:20px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface)}
.suggest:hover{border-color:var(--brand);color:var(--brand)}
.chat-input{display:flex;gap:10px}
.chat-input input{flex:1;padding:13px 16px;border:1px solid var(--line-2);border-radius:13px;font-size:13.5px;outline:none}
.chat-input input:focus{border-color:var(--brand)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(14,20,34,.45);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:600px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .2s ease}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
.modal-body{padding:22px 24px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1px solid var(--line-2);border-radius:11px;font-size:13.5px;outline:none;background:var(--surface)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface)}
.sub-h{font-size:12.5px;font-weight:800;color:var(--ink);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sub-h::before{content:"";width:4px;height:14px;border-radius:3px;background:linear-gradient(var(--brand),var(--brand-2))}

/* file drop */
.filedrop{border:1.5px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;background:var(--bg);transition:.15s;cursor:pointer}
.filedrop:hover{border-color:var(--brand);background:var(--brand-soft)}
.filedrop svg{color:var(--brand)}
.filedrop .fd-t{font-weight:700;font-size:13px;margin-top:8px}
.filedrop .fd-s{font-size:11.5px;color:var(--faint);margin-top:2px}

/* pos row */
.pos-row{display:grid;grid-template-columns:1fr 1.6fr 1.2fr auto;gap:8px;align-items:center}
.pos-card{border:1px solid var(--line-2);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
.pos-card .pos-row{margin-bottom:8px}
.pos-row select,.pos-row input,.pos-card select,.pos-card input{padding:9px 12px;border:1px solid var(--line-2);border-radius:11px;font-size:13px;outline:none;background:var(--surface);width:100%;color:var(--ink)}
.pos-row select:focus,.pos-row input:focus,.pos-card select:focus,.pos-card input:focus{border-color:var(--brand)}
.pos-num{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.pos-del{width:34px;height:34px;border-radius:9px;background:var(--rose-soft);color:#d22a45;display:grid;place-items:center;flex:none}
.pos-del:hover{background:var(--rose);color:#fff}
.mini-tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600;margin:2px 3px 0 0}

.section-gap{margin-top:20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.dl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.dv{font-weight:700;margin-top:3px;font-size:14px}
.danger-box{border:1px solid #f9c9d1;background:var(--rose-soft);border-radius:16px;padding:20px}

.hidden{display:none!important}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.cols-2,.cols-3,.cols-2e{grid-template-columns:1fr}.res-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:60;width:248px;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .hamb{display:grid;place-items:center}.search{display:none}
  .content{padding:18px 16px 40px}.topbar{padding:14px 16px}
  .pos-row{grid-template-columns:1fr 1fr;gap:6px}
}

/* ---- BASE DE COMERCIOS (puntos de venta) ---- */
VIEWS.puntos=()=>{
  const pts=mine(PUNTOS);
  const byBrand=pts.reduce((m,p)=>{(m[p.brand]=m[p.brand]||[]).push(p);return m},{});
  const byDist=Object.entries(pts.reduce((m,p)=>{m[p.distrito]=(m[p.distrito]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]);
  const dists=[...new Set(pts.map(p=>p.distrito))].sort();
  const brandsSorted=Object.keys(byBrand).sort((a,b)=>byBrand[b].length-byBrand[a].length);
  // PDV por distrito por KAM
  const kamDist={};pts.forEach(p=>{(kamDist[p.kam]=kamDist[p.kam]||{});kamDist[p.kam][p.distrito]=(kamDist[p.kam][p.distrito]||0)+1});
  const kamTotals=Object.entries(kamDist).map(([k,dd])=>[k,Object.values(dd).reduce((a,b)=>a+b,0),dd]).sort((a,b)=>b[1]-a[1]);
  return `<div class="row between page-h"><div><h2>Base de comercios</h2><p>${pts.length} puntos de venta en ${brandsSorted.length} marcas · se alimentan automáticamente desde Comercial</p></div>
  <button class="btn btn-ghost" onclick="exportMarcas()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>Exportar direcciones</button></div>
  <div class="grid cols-3 section-gap">
    <div class="card pad kpi"><div class="ic-wrap" style="background:var(--brand-soft);color:var(--brand)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.3-6-10a6 6 0 0112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></div><div class="val tnum">${pts.length}</div><div class="lbl">Puntos de venta</div></div>
    <div class="card pad kpi"><div class="ic-wrap" style="background:var(--sky-soft);color:var(--sky)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1.5-5h15L21 9M4 9h16v11H4z"/></svg></div><div class="val tnum">${brandsSorted.length}</div><div class="lbl">Marcas con sedes</div></div>
    <div class="card pad kpi"><div class="ic-wrap" style="background:var(--emerald-soft);color:var(--emerald)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg></div><div class="val tnum">${dists.length}</div><div class="lbl">Distritos cubiertos</div></div>
  </div>
  <div class="filterbar">
    <input class="input" id="posSearch" placeholder="Buscar dirección o marca…" oninput="filterPuntos()" style="min-width:240px"/>
    <select class="input" id="posDist" onchange="filterPuntos()"><option value="">Todos los distritos</option>${dists.map(d=>`<option>${d}</option>`).join("")}</select>
    <select class="input" id="posBrand" onchange="filterPuntos()"><option value="">Todas las marcas</option>${brandsSorted.slice().sort().map(b=>`<option>${b}</option>`).join("")}</select>
  </div>
  <div class="grid cols-2 section-gap">
    <div id="brandGroups" style="display:flex;flex-direction:column;gap:16px">
      ${brandsSorted.map(b=>posGroup(b,byBrand[b])).join("")||emptyState("Sin puntos de venta","Crea un comercio con puntos de venta en Comercial")}
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="card pad"><div class="h-title" style="margin-bottom:12px">Distribución por distrito</div>${byDist.length?hbars(byDist.slice(0,8),(l,i)=>["#6D28D9","#7C3AED","#9333EA","#A855F7","#C026D3","#DB2777","#EC4899","#F472B6"][i]||"#6D28D9"):'<span class="faint">Sin datos</span>'}</div>
      <div class="card pad"><div class="h-title" style="margin-bottom:4px">PDV por distrito y KAM</div>
        <div class="faint" style="font-size:11.5px;margin-bottom:12px">Cobertura de puntos de venta que gestiona cada KAM</div>
        ${kamTotals.length?kamTotals.map(([k,tot,dd])=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
          <div class="row between" style="margin-bottom:8px">${kamPill(k)}<span class="chip c-violet"><span class="d"></span>${tot} PDV</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(dd).sort((a,b)=>b[1]-a[1]).map(([d,n])=>`<span class="mini-tag">${d} · <b>${n}</b></span>`).join("")}</div>
        </div>`).join(""):'<span class="faint">Sin datos</span>'}
      </div>
    </div>
  </div>`;
};
function posGroup(brand,list){const cat=(list[0]||{}).cat;const kam=(list[0]||{}).kam;
  const ordered=list.slice().sort((a,b)=>(a.distrito+a.dir).localeCompare(b.distrito+b.dir));
  return `<div class="card pad brand-group" data-brand="${esc(brand)}">
    <div class="row between" style="margin-bottom:10px">
      <div class="row" style="gap:11px"><div class="t-logo" style="width:38px;height:38px;border-radius:11px;font-size:14px;background:${catColor(cat)}">${initials(brand)}</div>
      <div><div style="font-weight:800;font-size:15px">${brand}</div><span class="chip c-slate" style="margin-top:2px"><span class="d"></span>${cat}</span></div></div>
      <div style="text-align:right"><div class="tnum" style="font-weight:800;font-size:18px">${list.length}</div><div class="faint" style="font-size:10px">puntos de venta</div></div>
    </div>
    <div class="row between" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:8px">${kamPill(kam)}<span class="faint" style="font-size:11.5px">${[...new Set(list.map(p=>p.distrito))].length} distritos</span></div>
    <div class="tbl-wrap"><table class="table" style="min-width:auto"><thead><tr><th>Dirección</th><th>Distrito</th><th>Código(s)</th></tr></thead>
    <tbody>${ordered.map(posRow).join("")}</tbody></table></div>
  </div>`;
}
function posRow(p){return `<tr class="pos-tr" data-brand="${esc(p.brand)}" data-dist="${p.distrito}"><td><span style="font-weight:600">${p.via} ${p.dir}</span></td><td><span class="mini-tag">${p.distrito}</span></td><td>${(p.codigos||"").split(",").filter(x=>x.trim()).map(c=>`<span class="mini-tag">${c.trim()}</span>`).join("")||'<span class="faint">—</span>'}</td></tr>`}
function filterPuntos(){const q=($("#posSearch").value||"").toLowerCase();const d=$("#posDist").value;const b=$("#posBrand").value;
  document.querySelectorAll("#brandGroups .brand-group").forEach(g=>{let vis=0;
    g.querySelectorAll(".pos-tr").forEach(r=>{const ok=(!d||r.dataset.dist===d)&&(!b||r.dataset.brand===b)&&(!q||r.textContent.toLowerCase().includes(q)||r.dataset.brand.toLowerCase().includes(q));r.style.display=ok?"":"none";if(ok)vis++});
    g.style.display=vis?"":"none";});}

/* ---- CRM ---- */
// Salud real = respuestas (responsividad del contacto) + reuniones + ejecución de campañas
function crmSalud(c){
  const inters=INTERACTIONS.filter(i=>i.contactId===c.id||i.brand===c.brand);
  const reun=inters.filter(i=>i.tipo==="Reunión").length;
  const resp=inters.filter(i=>["Llamada","Seguimiento","Acuerdo","Próxima acción"].includes(i.tipo)).length;
  const ejec=[...CAMPAIGNS,...INCENTIVOS].filter(x=>x.brand===c.brand).length;
  const respScore=Math.max(0,Math.min(100,c.salud||0));           // respuestas: qué tan bien responde
  const reunScore=Math.min(100,reun*50);                          // reuniones sostenidas
  const ejecScore=Math.min(100,ejec*45);                          // campañas/incentivos ejecutados
  const total=Math.round(respScore*0.4+reunScore*0.3+ejecScore*0.3);
  const lastDate=inters.map(i=>i.fecha).filter(Boolean).sort().slice(-1)[0]||"";
  return {reun,resp,ejec,respScore,reunScore,ejecScore,total,lastDate};
}

function stars(n){n=Math.max(0,Math.min(5,Math.round(n)));let h="";for(let i=1;i<=5;i++)h+=`<span style="color:${i<=n?'#F59E0B':'#E4E7EE'}">★</span>`;return `<span style="font-size:13px;letter-spacing:1px">${h}</span>`;}
function contratoPill(x){const m={"Ganado":["c-emerald","Ganado"],"En proceso":["c-amber","En proceso"],"Perdido":["c-rose","Perdido"]};const[cl,t]=m[x]||m["En proceso"];return `<span class="chip ${cl}"><span class="d"></span>${t}</span>`;}
function dealMeta(d){
  const brand=COMMERCES.find(b=>b.n===d.brand)||{};
  const contact=d.contactId?CONTACTS.find(c=>c.id===d.contactId):null;
  const cat=brand.cat||"Moda";
  const inters=INTERACTIONS.filter(i=>(d.contactId&&i.contactId===d.contactId)||i.brand===d.brand);
  const promosActivas=CAMPAIGNS.filter(c=>c.brand===d.brand&&c.estado==="Activa").length;
  const convenio=CONVENIOS.some(cv=>cv.brand===d.brand);
  const s=contact?crmSalud(contact):null;
  const contrato=d.etapa==="Convenio firmado"?"Ganado":(d.etapa==="Perdido"?"Perdido":"En proceso");
  const rating=s?Math.round(s.total/20):(d.rating||0);
  return {brand,contact,cat,inters,promosActivas,convenio,pct:ETAPA_PCT[d.etapa]||0,contrato,rating,kam:brand.kam};
}

function createDealAction(){const d=DEALS.find(x=>x.id===+$("#da_deal").value);if(!d)return;
  d.etapa=$("#da_etapa").value;if($("#da_next").value)d.next=$("#da_next").value;if($("#da_nextdate").value)d.nextDate=$("#da_nextdate").value;
  const fmap={"Prospecto":"Prospectos","Contactado":"En gestión","Propuesta":"En gestión","Negociación":"En gestión","Convenio firmado":"Contrato conseguido","Perdido":"Prospectos"};
  advanceFunnel(d,fmap[d.etapa]||"Prospectos");
  const tipo=$("#da_tipo").value,detalle=$("#da_t").value||tipo,fecha=$("#da_fecha").value;
  const contact=d.contactId?CONTACTS.find(c=>c.id===d.contactId):null;
  INTERACTIONS.push({id:Date.now(),contactId:d.contactId||null,contactName:contact?contact.name:d.brand,brand:d.brand,tipo,t:detalle,fecha,next:$("#da_next").value,etapa:d.etapa});

}

/* ============ shared small ============ */
function emptyState(t,s){return `<div class="card pad" style="grid-column:1/-1;text-align:center;padding:48px"><div style="font-weight:800;font-size:15px">${t}</div><div class="faint" style="margin-top:4px">${s}</div></div>`}
function emptyRow(c,t){return `<tr><td colspan="${c}" style="text-align:center;color:var(--faint);padding:34px">${t}</td></tr>`}
function calendar(){
  const y=2026,mo=5,days=30;const first=new Date(y,mo,1).getDay();const offset=(first+6)%7;const today=18;
  const ev={};mine(TASKS).forEach(t=>{if(t.fecha&&t.fecha.startsWith("2026-06")){const d=+t.fecha.slice(8);(ev[d]=ev[d]||[]).push(t.tipo)}});
  let html='<div class="cal-grid">'+["L","M","M","J","V","S","D"].map(d=>`<div class="cal-h">${d}</div>`).join("");
  for(let i=0;i<offset;i++)html+='<div class="cal-d muted"></div>';
  for(let d=1;d<=days;d++){const has=ev[d];const dots=has?`<div class="evd">${[...new Set(has)].map(t=>`<i style="background:${t==='reunion'?'#0FB97B':'#6D28D9'}"></i>`).join("")}</div>`:"";
    html+=`<div class="cal-d ${d===today?'today':''} ${has?'has':''}" ${has?`onclick="openDayAgenda(${d})"`:""}>${d}${dots}</div>`}
  return html+'</div>';
}
function openDayAgenda(d){const items=mine(TASKS).filter(t=>t.fecha===`2026-06-${String(d).padStart(2,'0')}`);
  $("#modal").className="modal";
  $("#modal").innerHTML=modalHead(`Agenda · ${d} junio 2026`)+`<div class="modal-body">${items.map(t=>`<div class="task"><div class="tcheck ${t.done?'done':''}" onclick="toggleTask(${t.id});openDayAgenda(${d})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div><div class="ttext" style="${t.done?'text-decoration:line-through;color:var(--faint)':''}">${t.t}</div><div class="tmeta">${t.tipo==='reunion'?'Reunión':'Tarea'} · ${t.meta}</div></div></div>`).join("")||'<div class="faint">Nada agendado</div>'}</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`;openModal();
}

function toggleTask(id){const t=TASKS.find(x=>x.id===id);if(t)t.done=!t.done}
function markCalled(id){const c=CALLS.find(x=>x.id===id);if(!c)return;CALLS=CALLS.filter(x=>x.id!==id);

function toast(msg){const t=document.createElement("div");t.textContent=msg;t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0E1422;color:#fff;padding:13px 20px;border-radius:12px;font-weight:600;font-size:13px;z-index:200;box-shadow:var(--shadow-lg);animation:pop .2s";document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ============ EXPORTABLES (CSV) ============ */
function downloadCSV(filename,headers,rows){
  const q=v=>{v=(v==null?"":String(v));return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=[headers.map(q).join(","),...rows.map(r=>r.map(q).join(","))].join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100);
  toast("Exportado · "+filename);
}
function exportClientes(){const rows=mine(CONTACTS.map(c=>({...c,kam:(COMMERCES.find(b=>b.n===c.brand)||{}).kam}))).map(c=>[c.name,c.brand,c.role,c.tel,c.email,c.salud+"%",c.convenio||""]);
  if(!rows.length)return toast("No hay clientes para exportar");
  downloadCSV("contactos.csv",["Contacto","Marca","Cargo","Celular","Email","Salud","Convenio"],rows);}
function exportMarcas(){const rows=[];mine(COMMERCES).forEach(b=>{const pts=PUNTOS.filter(p=>p.brandId===b.id);
  if(pts.length)pts.forEach(p=>rows.push([b.n,b.cat,b.razonSocial||"",b.ruc||"",b.kam,`${p.via} ${p.dir}`,p.distrito,p.codigos||""]));
  else rows.push([b.n,b.cat,b.razonSocial||"",b.ruc||"",b.kam,"","",b.codigos||""]);});
  if(!rows.length)return toast("No hay marcas para exportar");
  downloadCSV("marcas_direcciones_codigos.csv",["Marca","Categoría","Razón social","RUC","KAM","Dirección","Distrito","Código(s) comercio"],rows);}
function exportCampanas(){const rows=mine(CAMPAIGNS).map(c=>[c.nombre||"",c.brand,c.cat,c.kam,c.canal,c.promo||"",c.inc,c.cupon,c.material||"",c.ini,c.fin,c.estado,(c.pos||[]).join(" | ")]);
  if(!rows.length)return toast("No hay campañas para exportar");
  downloadCSV("campanas.csv",["Nombre","Marca","Categoría","KAM","Canal","Promoción/Beneficio","Incentivo","Cupón","Material específico","Inicio","Fin","Estado","Puntos de venta"],rows);}
function exportIncentivos(){const rows=mine(INCENTIVOS).map(c=>[c.brand,c.cat,c.kam,c.inc,c.ini,c.fin,(c.pos||[]).join(" | "),c.tyc||""]);
  if(!rows.length)return toast("No hay incentivos para exportar");
  downloadCSV("incentivos.csv",["Marca","Categoría","KAM","Incentivo","Inicio","Fin","Puntos de venta","T&C"],rows);}
function exportPromociones(){
  const rows=[
    ...mine(CAMPAIGNS).map(c=>["Campaña",c.nombre||"",c.brand,c.cat,c.kam,c.canal||"",c.promo||"",c.inc||"",c.cupon||"",c.material||"",c.ini,c.fin,c.estado,(c.pos||[]).join(" | "),c.tyc||""]),
    ...mine(INCENTIVOS).map(c=>["Incentivo","",c.brand,c.cat,c.kam,"—",c.inc||"","","","",c.ini,c.fin,"Incentivo",(c.pos||[]).join(" | "),c.tyc||""])
  ];
  if(!rows.length)return toast("No hay promociones para exportar");
  downloadCSV("promociones.csv",["Tipo","Nombre","Marca","Categoría","KAM","Canal","Promoción/Beneficio","Incentivo","Cupón","Material específico","Inicio","Fin","Estado","Puntos de venta","T&C"],rows);}
function exportConvenios(){const rows=mine(CONVENIOS.map(c=>({...c,kam:(COMMERCES.find(b=>b.n===c.brand)||{}).kam}))).map(c=>[c.name,c.brand,c.contact||"",c.type||"PDF",c.vigencia||""]);
  if(!rows.length)return toast("No hay convenios para exportar");
  downloadCSV("convenios.csv",["Convenio","Marca","Contacto","Formato","Vigencia"],rows);}

function askAI(q){if(!q||!q.trim())return;const body=$("#chatBody");$("#chatInput").value="";body.innerHTML+=`<div class="bubble user">${q}</div>`;body.scrollTop=body.scrollHeight;
  setTimeout(()=>{body.innerHTML+=`<div class="bubble ai">${aiAnswer(q)}</div>`;body.scrollTop=body.scrollHeight},400)}
function aiAnswer(q){q=q.toLowerCase();const camps=mine(CAMPAIGNS);const activas=camps.filter(c=>c.estado==="Activa");
  if(q.includes("activ")) return activas.length?`Tienes <b>${activas.length} campañas activas</b>: ${activas.map(c=>c.brand).join(", ")}.`:"No hay campañas activas ahora.";
  if(q.includes("vence")||q.includes("semana")){const v=camps.filter(c=>daysLeft(c.fin)<=7&&daysLeft(c.fin)>=0);return `Vencen en 7 días: ${v.map(c=>`<b>${c.brand}</b> (${daysLeft(c.fin)}d)`).join(", ")||"ninguna"}.`}
  if(q.includes("contact")){const calls=mine(CALLS);return calls.length?`Tienes <b>${calls.length} contactos por contactar</b>: ${calls.map(c=>`${c.name} (${c.brand})`).join(", ")}.`:"Nadie pendiente por contactar 🎉"}
  if(q.includes("resum")||q.includes("mes")||q.includes("resultado"))return `<b>Resultados de junio:</b> ${RESULTS.metrics.map(m=>`${m.label} ${m.value}`).join(" · ")}.`;
  return "Puedo ayudarte con campañas activas, vencimientos, contactos por contactar o resultados del mes ✨";}

}

const TITLES={dashboard:["Dashboard ejecutivo","Estado general del proyecto"],comercial:["Comercial","Comercios afiliados"],puntos:["Base de comercios","Puntos de venta consolidados"],campanas:["Campañas & Incentivos","Crea y monitorea en segundos"],crm:["Funnel comercial","Avance de contratos y promociones"],biblioteca:["Biblioteca","Convenios y banco de assets"],ejecutivo:["Dashboard Ejecutivo","Visión consolidada"],ia:["IA Assistant","Tu copiloto"],admin:["Panel Admin","Administración"]};
function go(view){if(!VIEWS[view])view="dashboard";state.view=view;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.view===view));
  const[t,s]=TITLES[view];const first=USER.name.split(" ")[0];
  $("#greet").innerHTML=`<h1>${view==='dashboard'?`Hola, ${first} 👋`:t}</h1><p>${s}</p>`;
  $("#content").innerHTML=VIEWS[view]();window.scrollTo(0,0);toggleNav(false);
  if(view==="campanas")filterCamps();
}
const state={view:"dashboard"};
document.addEventListener("click",e=>{const nav=e.target.closest("[data-view]");if(nav&&USER)go(nav.dataset.view)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-mfilter]");if(b){document.querySelectorAll("[data-mfilter]").forEach(x=>x.classList.remove("on"));b.classList.add("on");const f=b.dataset.mfilter;document.querySelectorAll("#brandGrid .card").forEach(c=>c.style.display=(f==="all"||c.dataset.cat===f)?"":"none")}
  const t=e.target.closest("[data-tfilter]");if(t){document.querySelectorAll("[data-tfilter]").forEach(x=>x.classList.remove("on"));t.classList.add("on");filterCamps()}});
$("#globalSearch").addEventListener("input",e=>{const q=e.target.value.toLowerCase();if(state.view!=="comercial"&&q)go("comercial");if(state.view==="comercial")document.querySelectorAll("#brandGrid .card").forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?"":"none")});

function openModal(){$("#overlay").classList.add("open")}
function closeModal(){$("#overlay").classList.remove("open")}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
function toggleNav(open){const s=$("#sidebar"),sc=$("#scrim");if(open===undefined)open=!s.classList.contains("open");s.classList.toggle("open",open);sc.classList.toggle("open",open)}
